<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wegovy Sentinel — search performance</title>
<link rel="stylesheet" href="assets/ui.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="brand">SENTINEL</span>
    <span class="brand-sub" id="brand-sub">simpleonlinepharmacy.co.uk</span>
    <div class="pills" data-pill-group="product" id="product-pills" style="margin-left:14px">
      <button type="button" class="pill active" data-value="mounjaro">Mounjaro</button>
      <button type="button" class="pill" data-value="wegovy">Wegovy pill</button>
      <button type="button" class="pill" data-value="injection">Wegovy injection</button>
      <button type="button" class="pill" data-value="weightloss">Weight loss hub</button>
      <button type="button" class="pill" data-value="home">Homepage</button>
      <button type="button" class="pill" data-value="blogs">Blog test</button>
    </div>
  </div>
  <div class="topbar-right">
    <div class="pills" data-pill-group="daterange" id="daterange-pills">
      <button type="button" class="pill" data-value="28D">28D</button>
      <button type="button" class="pill active" data-value="90D">90D</button>
      <button type="button" class="pill" data-value="6M">6M</button>
      <button type="button" class="pill" data-value="All">All</button>
      <button type="button" class="pill" data-value="Custom">Custom</button>
    </div>
    <div class="custom-dates" id="custom-dates" hidden>
      <input type="date" id="date-from" aria-label="From date">
      <span class="patrol-note">→</span>
      <input type="date" id="date-to" aria-label="To date">
    </div>
    <span class="patrol-note" id="patrol-note"></span>
  </div>
</header>

<div class="page">
  <div class="page-header">
    <h1>Mounjaro — search performance</h1>
    <div class="sub">Daily rank patrol, Search Console trends and on-page change tracking for the Mounjaro cluster.</div>
  </div>
  <main id="sections"></main>
</div>

<footer class="footer">Collected daily by GitHub Actions · history in <code>data/</code></footer>

<script>
(function () {
  'use strict';

  var sections = [];

  var PRODUCTS = {
    wegovy: {
      key: 'wegovy', label: 'Wegovy pill', pageLabel: 'Pill page',
      hero: 'wegovy pill',
      mainKws: ['wegovy pill', 'wegovy pills', 'wegovy price',
                'wegovy price uk', 'wegovy uk', 'oral semaglutide'],
      title: 'Wegovy pill — search performance',
      sub: 'Daily rank patrol, Search Console trends and on-page change tracking for the Wegovy pill cluster.',
      files: { snaps: './snapshots.json', changelog: './changelog.json', content: './content.json' }
    },
    injection: {
      key: 'injection', label: 'Wegovy injection', pageLabel: 'Injection page',
      hero: 'wegovy',
      mainKws: ['wegovy', 'wegovy uk', 'buy wegovy',
                'wegovy price', 'wegovy injection', 'wegovy pen'],
      title: 'Wegovy injection — search performance',
      sub: 'Daily rank patrol, Search Console trends and on-page change tracking for the Wegovy injection cluster.',
      files: { snaps: './wegovy_injection_snapshots.json',
               changelog: './wegovy_injection_changelog.json',
               content: './wegovy_injection_content.json' }
    },
    weightloss: {
      key: 'weightloss', label: 'Weight loss hub', pageLabel: 'Hub page',
      hero: 'weight loss injections',
      mainKws: ['weight loss injections', 'weight loss pills', 'weight loss medication',
                'weight loss jabs', 'glp-1 injections', 'weight loss tablets'],
      title: 'Weight loss hub — search performance',
      sub: 'Daily rank patrol, Search Console trends and on-page change tracking for /weight-loss/.',
      files: { snaps: './weightloss_snapshots.json',
               changelog: './weightloss_changelog.json',
               content: './weightloss_content.json' }
    },
    home: {
      key: 'home', label: 'Homepage', pageLabel: 'Homepage',
      hero: 'simple online pharmacy',
      mainKws: ['simple online pharmacy', 'online pharmacy', 'online pharmacy uk',
                'online chemist', 'pharmacy online', 'online doctor'],
      title: 'Homepage — search performance',
      sub: 'Daily rank patrol, Search Console trends and on-page change tracking for simpleonlinepharmacy.co.uk.',
      files: { snaps: './homepage_snapshots.json',
               changelog: './homepage_changelog.json',
               content: './homepage_content.json' }
    },
    blogs: {
      key: 'blogs', label: 'Blog test', pageLabel: 'Blog pages',
      hero: '', mainKws: [],
      sections: ['blogtest'],
      title: 'Blog template test — before & after',
      sub: 'A cohort of striking-distance blog pages moving to the new template, measured against their GSC baseline.',
      files: { snaps: './__none__.json', changelog: './__none__.json', content: './__none__.json' }
    },
    mounjaro: {
      key: 'mounjaro', label: 'Mounjaro', pageLabel: 'Mounjaro page',
      hero: 'mounjaro',
      mainKws: ['mounjaro', 'mounjaro uk', 'buy mounjaro',
                'mounjaro price', 'mounjaro pen', 'tirzepatide'],
      title: 'Mounjaro — search performance',
      sub: 'Daily rank patrol, Search Console trends and on-page change tracking for the Mounjaro cluster.',
      files: { snaps: './mounjaro_snapshots.json', changelog: './mounjaro_changelog.json', content: './mounjaro_content.json' }
    }
  };
  var startProduct = (location.hash || '').replace('#', '');
  if (!PRODUCTS[startProduct]) startProduct = 'mounjaro';

  window.Sentinel = {
    data: { snaps: [], changelog: [], content: [] },
    state: { from: '', to: '', preset: '90D' },
    product: PRODUCTS[startProduct],
    pillHandlers: {},
    register: function (sec) {
      // {id, title, sub, order, render}
      sections.push(sec);
    },
    rerender: function () {
      var main = document.getElementById('sections');
      sections.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      sections.forEach(function (sec) {
        var card = document.getElementById('sec-' + sec.id);
        if (!card) {
          card = document.createElement('section');
          card.className = 'card';
          card.id = 'sec-' + sec.id;
          card.innerHTML =
            '<div class="card-head">' +
              '<h2 class="card-title"></h2>' +
              '<div class="card-sub"></div>' +
            '</div>' +
            '<div class="card-body"></div>';
          main.appendChild(card);
        }
        var S = window.Sentinel;
        var allowed = !(sec.only && sec.only !== S.product.key) &&
          !(S.product.sections && S.product.sections.indexOf(sec.id) === -1);
        card.hidden = !allowed;
        if (!allowed) return;
        card.querySelector('.card-title').textContent = sec.title || '';
        var subEl = card.querySelector('.card-sub');
        subEl.textContent = sec.sub || '';
        subEl.hidden = !sec.sub;
        try {
          sec.render(card.querySelector('.card-body'), window.Sentinel);
        } catch (e) {
          card.querySelector('.card-body').innerHTML =
            '<div class="panel"><div class="empty">Section failed to render.</div></div>';
          if (window.console) console.error('Section "' + sec.id + '" render error:', e);
        }
      });
    }
  };

  /* ---------- helpers ---------- */

  function iso(dt) { return dt.toISOString().slice(0, 10); }
  function shiftDays(isoStr, n) {
    var dt = new Date(isoStr + 'T00:00:00Z');
    dt.setUTCDate(dt.getUTCDate() + n);
    return iso(dt);
  }

  function fetchJson(url) {
    return fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; });
  }

  function maxDataDate(snaps) {
    var max = '';
    (snaps || []).forEach(function (s) {
      if (s && s.date && s.date > max) max = s.date;
      var g = s && s.gscts;
      if (g) {
        ['site', 'page'].forEach(function (k) {
          (g[k] || []).forEach(function (p) {
            if (p && p.d && p.d > max) max = p.d;
          });
        });
      }
    });
    return max || iso(new Date());
  }

  function minDataDate(snaps) {
    var min = '';
    (snaps || []).forEach(function (s) {
      if (s && s.date && (!min || s.date < min)) min = s.date;
      var g = s && s.gscts;
      if (g) {
        ['site', 'page'].forEach(function (k) {
          (g[k] || []).forEach(function (p) {
            if (p && p.d && (!min || p.d < min)) min = p.d;
          });
        });
      }
    });
    return min;
  }

  function applyPreset(preset) {
    var S = window.Sentinel;
    var maxD = maxDataDate(S.data.snaps);
    S.state.preset = preset;
    if (preset === '28D') {
      S.state.to = maxD; S.state.from = shiftDays(maxD, -27);
    } else if (preset === '90D') {
      S.state.to = maxD; S.state.from = shiftDays(maxD, -89);
    } else if (preset === '6M') {
      S.state.to = maxD; S.state.from = shiftDays(maxD, -182);
    } else if (preset === 'All') {
      S.state.to = maxD; S.state.from = minDataDate(S.data.snaps) || shiftDays(maxD, -365);
    }
    // Custom keeps current from/to; the date inputs drive it.
    syncDateUI();
  }

  function syncDateUI() {
    var S = window.Sentinel;
    var group = document.getElementById('daterange-pills');
    Array.prototype.forEach.call(group.querySelectorAll('.pill'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-value') === S.state.preset);
    });
    document.getElementById('custom-dates').hidden = S.state.preset !== 'Custom';
    document.getElementById('date-from').value = S.state.from;
    document.getElementById('date-to').value = S.state.to;
  }

  /* ---------- global pill delegation ---------- */

  document.addEventListener('click', function (ev) {
    var pill = ev.target.closest ? ev.target.closest('[data-value]') : null;
    if (!pill) return;
    var group = pill.closest('[data-pill-group]');
    if (!group) return;
    var gid = group.getAttribute('data-pill-group');
    var value = pill.getAttribute('data-value');

    if (gid === 'daterange') {
      applyPreset(value);
      window.Sentinel.rerender();
      return;
    }
    var fn = window.Sentinel.pillHandlers[gid];
    if (typeof fn === 'function') fn(value);
    window.Sentinel.rerender();
  });

  document.getElementById('date-from').addEventListener('change', function () {
    if (this.value) { window.Sentinel.state.from = this.value; window.Sentinel.rerender(); }
  });
  document.getElementById('date-to').addEventListener('change', function () {
    if (this.value) { window.Sentinel.state.to = this.value; window.Sentinel.rerender(); }
  });

  /* ---------- boot ---------- */

  function loadProduct(key) {
    var S = window.Sentinel;
    var prod = PRODUCTS[key] || PRODUCTS.wegovy;
    S.product = prod;
    if (history.replaceState) history.replaceState(null, '', '#' + prod.key);
    var pp = document.getElementById('product-pills');
    Array.prototype.forEach.call(pp.querySelectorAll('.pill'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-value') === prod.key);
    });
    document.querySelector('.page-header h1').textContent = prod.title;
    document.title = prod.label + ' Sentinel — search performance';
    document.querySelector('.page-header .sub').textContent = prod.sub;
    return Promise.all([
      fetchJson(prod.files.snaps),
      fetchJson(prod.files.changelog),
      fetchJson(prod.files.content)
    ]).then(function (res) {
      S.data.snaps = Array.isArray(res[0]) ? res[0] : [];
      S.data.changelog = Array.isArray(res[1]) ? res[1] : [];
      S.data.content = Array.isArray(res[2]) ? res[2] : [];
      applyPreset(S.state.preset === 'Custom' ? '90D' : S.state.preset);
      var last = S.data.snaps.length ? S.data.snaps[S.data.snaps.length - 1] : null;
      if (last) {
        document.getElementById('patrol-note').textContent =
          'Last patrol: ' + last.date + ' · day ' + S.data.snaps.length;
      } else {
        document.getElementById('patrol-note').textContent =
          'No ' + prod.label + ' patrol data yet — first patrol populates this view';
      }
    });
  }

  window.Sentinel.pillHandlers['product'] = function (value) {
    // async load: rerender happens when the product's data arrives
    loadProduct(value).then(function () { window.Sentinel.rerender(); });
  };

  window.addEventListener('hashchange', function () {
    var key = (location.hash || '').replace('#', '');
    if (PRODUCTS[key] && key !== window.Sentinel.product.key) {
      loadProduct(key).then(function () { window.Sentinel.rerender(); });
    }
  });

  var dataReady = loadProduct(startProduct);

  var domReady = new Promise(function (resolve) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', resolve);
    } else { resolve(); }
  });

  Promise.all([dataReady, domReady]).then(function () {
    window.Sentinel.rerender();
  });
})();
</script>

<script src="assets/charts.js"></script>
<script defer src="assets/sections/perf.js" onerror="this.remove()"></script>
<script defer src="assets/sections/movers.js" onerror="this.remove()"></script>
<script defer src="assets/sections/rankings.js" onerror="this.remove()"></script>
<script defer src="assets/sections/content.js" onerror="this.remove()"></script>
<script defer src="assets/sections/blogtest.js" onerror="this.remove()"></script>

</body>
</html>
