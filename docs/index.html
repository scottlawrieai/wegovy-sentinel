<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wegovy Sentinel — daily rank patrol</title>
<style>
  :root{
    --ink:#FFFFFF; --panel:#FFFFFF; --panel2:#F1F3F4; --line:#DADCE0;
    --cream:#202124; --slate:#5F6368; --gold:#E8710A; --red:#D93025; --green:#1E8E3E;
    --blue:#4285F4; --purple:#5E35B1; --teal:#00897B; --bg:#F8F9FA;
    --shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--cream);font-family:'Google Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding-bottom:48px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .strip{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .strip h1{font-size:18px;letter-spacing:.02em;font-weight:500}
  .strip h1 span{color:var(--gold)}
  .sub{font-size:11px;color:var(--slate);margin-top:2px}
  .meta{margin-left:auto;text-align:right;font-size:11px;color:var(--slate)}
  .eyebrow{font-size:10px;letter-spacing:.14em;color:var(--slate);text-transform:uppercase;font-weight:600}
  .banner{margin:16px 20px 0;padding:12px 16px;border-radius:8px;font-size:12px;font-weight:600}
  .grid{display:flex;flex-wrap:wrap;gap:16px;padding:16px 20px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--shadow)}
  .alt-wrap{flex:0 0 200px;min-width:180px}
  .alt{position:relative;width:44px;height:300px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .alt .zone{position:absolute;top:0;left:0;right:0;background:rgba(232,113,10,.12);border-bottom:1px dashed var(--gold)}
  .alt .t3{position:absolute;left:0;right:0;border-top:2px solid var(--green)}
  .alt .base{position:absolute;left:0;right:0;border-top:1px dotted var(--slate)}
  .alt .mk{position:absolute;left:4px;right:4px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
  .scale{display:flex;flex-direction:column;justify-content:space-between;height:300px;font-size:10px;color:var(--slate)}
  .flags{flex:1 1 320px;min-width:280px;display:flex;flex-direction:column;gap:10px}
  .flag{border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;border:1px solid}
  .flag.bad{background:#FCE8E6;border-color:#F5C6C2;color:#C5221F}
  .flag.ok{background:#E6F4EA;border-color:#B7E1C4;color:#0D652D}
  .chip{font-size:10px;font-weight:600;letter-spacing:.06em;padding:3px 8px;border-radius:10px;color:#fff;white-space:nowrap}
  .trend{flex:1 1 340px;min-width:300px}
  table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
  th{padding:8px 10px;border-bottom:1px solid var(--line);letter-spacing:.08em;font-size:10px;color:var(--slate);text-align:left;font-weight:600}
  td{padding:8px 10px;border-bottom:1px solid #F1F3F4}
  tr:nth-child(even) td{background:#FAFBFC}
  .tbl{margin:16px 20px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;box-shadow:var(--shadow)}
  .tbl .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
  .comp-tbl{margin:16px 20px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;box-shadow:var(--shadow)}
  .comp-tbl .hd{padding:12px 16px;border-bottom:1px solid var(--line)}
  .foot{margin:16px 20px 0;font-size:11px;color:var(--slate);line-height:1.6}
  .foot .rule{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  button{font-family:inherit;font-size:11px;background:var(--panel);color:var(--blue);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:600}
  button:hover{background:#F1F3F4}
  svg text{font-family:ui-monospace,Menlo,monospace}
  .err{margin:24px 20px;padding:14px;border:1px solid var(--gold);background:#FEF7E0;border-radius:8px;color:#B06000;font-size:12px;line-height:1.6}
  .pos-cell{font-weight:700;font-size:12px}
  .win{color:#1E8E3E}.lose{color:#D93025}.tie{color:#5F6368}.na{color:#5F6368}
  .flag.warnflag{background:#FEF7E0;border-color:#FDE293;color:#B06000}
  .section-hd{margin:30px 20px 0;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
  .section-hd h2{font-size:16px;letter-spacing:0;color:var(--cream);font-weight:500}
  .gauge{font-size:36px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .tag{font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:10px;color:#fff}
  .gap-chip{display:inline-block;font-size:11px;padding:3px 8px;margin:3px 4px 0 0;border-radius:10px;background:#FCE8E6;border:1px solid #F5C6C2;color:#C5221F}
  .opp{font-size:12.5px;line-height:1.5;padding:6px 0;border-bottom:1px solid #F1F3F4}
  .opp:last-child{border-bottom:none}
  .role-us{background:#E8710A}.role-competitor{background:#5F6368}.role-brand{background:#1E8E3E}
  /* --- Search Console performance panel --- */
  .perf{margin:16px 20px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
  .tiles{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .tile{flex:1 1 160px;min-width:150px;padding:14px 18px;border-right:1px solid var(--line);cursor:pointer;position:relative;background:#FAFBFC;transition:background .12s}
  .tile:last-child{border-right:none}
  .tile:hover{background:#F1F3F4}
  .tile.on{background:var(--panel)}
  .tile.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c)}
  .tile .lbl{font-size:11px;color:var(--slate);display:flex;align-items:center;gap:6px}
  .tile .dot{width:10px;height:10px;border-radius:2px;background:var(--c);opacity:.35}
  .tile.on .dot{opacity:1}
  .tile .val{font-size:26px;font-weight:400;margin-top:6px;font-family:ui-monospace,Menlo,monospace;color:var(--slate)}
  .tile.on .val{color:var(--c)}
  .tile .dlt{font-size:11px;margin-top:2px}
  .chartwrap{padding:14px 18px 6px;position:relative}
  .mk-tip{position:absolute;z-index:20;background:#202124;color:#fff;font-size:11px;line-height:1.5;padding:8px 10px;border-radius:6px;max-width:300px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .mk-tip b{color:#8AB4F8}
  .cl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #F1F3F4;font-size:12.5px}
  .cl-item:last-child{border-bottom:none}
  .cl-date{flex:0 0 92px;font-family:ui-monospace,Menlo,monospace;color:var(--slate);font-size:11px}
  .cl-type{font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:8px;text-transform:uppercase;color:#fff;flex:0 0 auto;align-self:flex-start}
</style>
</head>
<body>
<div class="strip">
  <div>
    <h1 class="mono">WEGOVY <span>SENTINEL</span> <span id="modeBadge"></span></h1>
    <div class="sub">Daily rank patrol · simpleonlinepharmacy.co.uk · GitHub Actions, 07:00 UK</div>
  </div>
  <div class="meta mono" id="meta"></div>
</div>
<div id="app"><div class="err">Loading snapshot history...</div></div>
<div id="content-app"></div>

<script>
const TRACKED=[
 {kw:"wegovy pill",goal:"pill",base:null,hero:true},
 {kw:"wegovy pills",goal:"pill",base:null},
 {kw:"buy wegovy pill",goal:"pill",base:null},
 {kw:"buy wegovy pills",goal:"pill",base:null},
 {kw:"wegovy pill uk",goal:"pill",base:null},
 {kw:"wegovy tablets",goal:"pill",base:null},
 {kw:"oral semaglutide",goal:"pill",base:null},
 {kw:"wegovy price",goal:"pill",base:8},
 {kw:"wegovy price uk",goal:"pill",base:8},
 {kw:"wegovy uk",goal:"pill",base:23},
 {kw:"cheapest wegovy uk",goal:"pill",base:14},
 {kw:"buy wegovy",goal:"injection",base:null},
 {kw:"buy wegovy uk",goal:"injection",base:null},
 {kw:"buy wegovy online",goal:"injection",base:null},
 {kw:"wegovy side effects",goal:"advice",base:8},
 {kw:"wegovy vs mounjaro",goal:"advice",base:25},
 {kw:"wegovy reviews",goal:"advice",base:23},
];
const COMP_LABELS=["Superdrug","Chemist4U","FamilyChemist","MedExpress"];
const COMP_SHORT={"Superdrug":"SD","Chemist4U":"C4U","FamilyChemist":"FC","MedExpress":"MX"};
const LBL={pill:"PILL PAGE",injection:"INJECTION",legacy:"LEGACY URL",advice:"ADVICE",other:"OTHER"};
const CLR={pill:"#E8710A",injection:"#1E8E3E",legacy:"#D93025",advice:"#5F6368",other:"#5F6368"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrow=d=>d==null?'<span style="color:#5F6368">--</span>':d===0?'<span style="color:#5F6368">=</span>':
 `<span style="color:${d>0?'#1E8E3E':'#D93025'};font-weight:700">${d>0?'+':'-'}${Math.abs(d)}</span>`;
const streak=(snaps,key)=>{let n=0;for(let i=snaps.length-1;i>=0;i--){if(snaps[i].flags&&snaps[i].flags[key])n++;else break;}return n;};
const altPct=p=>Math.min(100,Math.max(0,((Math.min(p,30)-1)/29)*100));

function trendSVG(snaps){
  const pts=snaps.slice(-30);
  if(pts.length<2)return '<div style="height:280px;display:flex;align-items:center;justify-content:center;color:#5F6368;font-size:12px;text-align:center">Trend appears after two patrols.</div>';
  const W=560,H=280,L=34,R=8,T=12,B=22,iw=W-L-R,ih=H-T-B;
  const x=i=>L+iw*(pts.length===1?0:i/(pts.length-1));
  const y=p=>T+ih*((Math.min(p,30)-1)/29);
  const line=(key,col)=>{
    const seg=pts.map((s,i)=>s.m&&s.m[key]!=null?`${x(i)},${y(s.m[key])}`:null).filter(Boolean);
    if(seg.length<2)return"";
    return `<polyline fill="none" stroke="${col}" stroke-width="2" points="${seg.join(" ")}"/>`
      +pts.map((s,i)=>s.m&&s.m[key]!=null?`<circle cx="${x(i)}" cy="${y(s.m[key])}" r="2.5" fill="${col}"/>`:"").join("");
  };
  const grid=[1,10,20,30].map(p=>`<line x1="${L}" x2="${W-R}" y1="${y(p)}" y2="${y(p)}" stroke="#DADCE0" stroke-dasharray="2 4"/><text x="4" y="${y(p)+3}" fill="#5F6368" font-size="10">${p}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:280px">
    ${grid}
    <line x1="${L}" x2="${W-R}" y1="${y(10)}" y2="${y(10)}" stroke="#E8710A" stroke-dasharray="4 4"/>
    <line x1="${L}" x2="${W-R}" y1="${y(3)}" y2="${y(3)}" stroke="#1E8E3E" stroke-dasharray="4 4"/>
    ${line("pill","#E8710A")}${line("bwInj","#1E8E3E")}
    <text x="${L}" y="${H-6}" fill="#5F6368" font-size="10">${esc(pts[0].date.slice(5))}</text>
    <text x="${W-R-38}" y="${H-6}" fill="#5F6368" font-size="10">${esc(pts[pts.length-1].date.slice(5))}</text>
  </svg>
  <div style="font-size:10px;color:#5F6368;margin-top:4px">Gold = pill keyword (pill page) -- Green = "buy wegovy" (injection page) -- lower is better</div>`;
}

function compCell(comp,label,kw,sopPos){
  const c=comp?.[label]?.[kw];
  if(!c) return '<td class="mono na">--</td>';
  const p=c.p;
  const cls=sopPos==null?"na":p<sopPos?"lose":p>sopPos?"win":"tie";
  return `<td class="mono pos-cell ${cls}">${c.u?`<a href="${esc(c.u)}" target="_blank" rel="noopener" style="color:inherit" title="${esc(c.u)}">${p}</a>`:p}</td>`;
}

// ---- Search Console performance panel -------------------------------------
let CHANGES=[];
const METRICS={
  clicks:{label:"Total clicks",      c:"#4285F4", fmt:v=>Math.round(v).toLocaleString()},
  impr:  {label:"Total impressions", c:"#5E35B1", fmt:v=>Math.round(v).toLocaleString()},
  ctr:   {label:"Average CTR",       c:"#00897B", fmt:v=>v.toFixed(1)+"%"},
  pos:   {label:"Average position",  c:"#E8710A", fmt:v=>v.toFixed(1), invert:true},
};
const CL_COLOR={ux:"#4285F4",seo:"#E8710A",content:"#5E35B1",structure:"#00897B",
                technical:"#5F6368",eeat:"#1E8E3E"};
let ACTIVE=new Set();

// Pick the richest series available: GSC pill page > GSC whole site > Semrush.
function buildSeries(cur,snaps){
  const ts=cur.gscts||{};
  if(ts.page&&ts.page.length)
    return {rows:ts.page,label:"pill page",asOf:ts.as_of,gsc:true};
  if(ts.site&&ts.site.length)
    return {rows:ts.site,label:"whole property",asOf:ts.as_of,gsc:true};
  const rows=snaps.filter(s=>s&&s.m&&s.m.pill!=null).map(s=>({d:s.date,pos:s.m.pill}));
  return {rows,label:"Semrush modelled position",asOf:null,gsc:false};
}

function perfChart(rows,marks){
  const W=1000,H=260,L=48,R=16,T=16,B=28;
  if(rows.length<2)
    return `<div style="height:${H}px;display:flex;align-items:center;justify-content:center;color:#5F6368;font-size:12px">Not enough data yet — the chart needs at least two days.</div>`;
  const iw=W-L-R, ih=H-T-B;
  const x=i=>L+iw*(i/(rows.length-1));
  const active=[...ACTIVE].filter(k=>rows.some(r=>r[k]!=null));

  // Each metric keeps its own scale, the way Search Console overlays them.
  const scale={};
  active.forEach(k=>{
    const vals=rows.map(r=>r[k]).filter(v=>v!=null);
    let lo=Math.min(...vals), hi=Math.max(...vals);
    if(lo===hi){lo=lo-1;hi=hi+1;}
    const pad=(hi-lo)*0.15; lo-=pad; hi+=pad;
    if(!METRICS[k].invert) lo=Math.min(lo,0);
    scale[k]=v=>{
      const t=(v-lo)/(hi-lo);
      return T+ih*(METRICS[k].invert?t:1-t);
    };
  });

  const grid=[0,.25,.5,.75,1].map(f=>{
    const yy=T+ih*f;
    return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#E8EAED"/>`;
  }).join("");

  // y-axis labels follow the first active metric
  const primary=active[0];
  let axis="";
  if(primary){
    const vals=rows.map(r=>r[primary]).filter(v=>v!=null);
    let lo=Math.min(...vals),hi=Math.max(...vals);
    if(lo===hi){lo=lo-1;hi=hi+1;}
    const pad=(hi-lo)*0.15; lo-=pad; hi+=pad;
    if(!METRICS[primary].invert) lo=Math.min(lo,0);
    axis=[0,.25,.5,.75,1].map(f=>{
      const val=METRICS[primary].invert?lo+(hi-lo)*f:hi-(hi-lo)*f;
      return `<text x="${L-8}" y="${T+ih*f+4}" fill="#5F6368" font-size="10" text-anchor="end">${METRICS[primary].fmt(val)}</text>`;
    }).join("");
  }

  const lines=active.map(k=>{
    const pts=rows.map((r,i)=>r[k]==null?null:`${x(i).toFixed(1)},${scale[k](r[k]).toFixed(1)}`).filter(Boolean);
    if(pts.length<2)return"";
    return `<polyline fill="none" stroke="${METRICS[k].c}" stroke-width="2" stroke-linejoin="round" points="${pts.join(" ")}"/>`;
  }).join("");

  // changelog markers, positioned on the matching date
  const idxOf={}; rows.forEach((r,i)=>{idxOf[r.d]=i;});
  let lastLabelX=-999;
  const mk=marks.filter(m=>idxOf[m.date]!=null).map(m=>{
    const i=idxOf[m.date], xx=+x(i).toFixed(1);
    const col=CL_COLOR[(m.changes[0]||{}).type]||"#5F6368";
    // Only label a marker that clears the previous one, so clustered release
    // dates stay readable. Every marker keeps its full hover target.
    const label=(xx-lastLabelX)>=32;
    if(label) lastLabelX=xx;
    return `<g class="mk-g" data-date="${esc(m.date)}" style="cursor:pointer">
      <line x1="${xx}" x2="${xx}" y1="${T}" y2="${T+ih}" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 3" opacity=".7"/>
      ${label?`<rect x="${xx-14}" y="${T+ih+4}" width="28" height="14" rx="3" fill="${col}"/>
      <text x="${xx}" y="${T+ih+14}" fill="#fff" font-size="9" text-anchor="middle">${esc(m.date.slice(5))}</text>`
      :`<circle cx="${xx}" cy="${T+ih+11}" r="3.5" fill="${col}"/>`}
      <rect x="${xx-8}" y="${T}" width="16" height="${ih}" fill="transparent"/>
    </g>`;
  }).join("");

  const dates=[0,Math.floor((rows.length-1)/2),rows.length-1].map(i=>
    `<text x="${x(i).toFixed(1)}" y="${H-4}" fill="#5F6368" font-size="10" text-anchor="${i===0?"start":i===rows.length-1?"end":"middle"}">${esc(rows[i].d)}</text>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible">
    ${grid}${axis}${lines}${mk}${dates}</svg>`;
}

function perfSection(cur,snaps){
  const s=buildSeries(cur,snaps);
  if(!s.rows.length)return"";
  const avail=Object.keys(METRICS).filter(k=>s.rows.some(r=>r[k]!=null));
  if(!ACTIVE.size) avail.slice(0,2).forEach(k=>ACTIVE.add(k));
  [...ACTIVE].forEach(k=>{if(!avail.includes(k))ACTIVE.delete(k);});
  if(!ACTIVE.size&&avail.length)ACTIVE.add(avail[0]);

  // headline value: sum for counts, mean for rates
  const tiles=avail.map(k=>{
    const vals=s.rows.map(r=>r[k]).filter(v=>v!=null);
    const half=Math.max(1,Math.floor(vals.length/2));
    const agg=a=>(k==="clicks"||k==="impr")?a.reduce((x,y)=>x+y,0):a.reduce((x,y)=>x+y,0)/a.length;
    const total=agg(vals);
    const d=vals.length>=4?agg(vals.slice(-half))-agg(vals.slice(0,half)):null;
    const better=d==null?null:(METRICS[k].invert?d<0:d>0);
    const dTxt=d==null?"":`<div class="dlt" style="color:${better?"#1E8E3E":"#D93025"}">${d>0?"▲":"▼"} ${METRICS[k].fmt(Math.abs(d))} vs first half</div>`;
    return `<div class="tile ${ACTIVE.has(k)?"on":""}" data-k="${k}" style="--c:${METRICS[k].c}">
      <div class="lbl"><span class="dot"></span>${METRICS[k].label}</div>
      <div class="val">${METRICS[k].fmt(total)}</div>${dTxt}</div>`;
  }).join("");

  const note=s.gsc
    ? `Google Search Console — ${esc(s.label)}${s.asOf?`, data to ${esc(s.asOf)}`:""}`
    : `Search Console not connected — showing ${esc(s.label)}. Add the GSC secrets to plot clicks, impressions and CTR.`;

  return `
  <div class="section-hd"><h2>Search performance</h2>
    <span class="eyebrow">${note} &middot; dashed markers are logged changes</span></div>
  <div class="perf">
    <div class="tiles">${tiles}</div>
    <div class="chartwrap" id="chartwrap">${perfChart(s.rows,CHANGES)}<div class="mk-tip" id="mkTip"></div></div>
  </div>`;
}

function changelogSection(){
  if(!CHANGES.length)return"";
  const items=CHANGES.slice().reverse().slice(0,14).map(e=>
    e.changes.map((c,i)=>`<div class="cl-item">
      <div class="cl-date">${i===0?esc(e.date):""}</div>
      <span class="cl-type" style="background:${CL_COLOR[c.type]||"#5F6368"}">${esc(c.type||"change")}</span>
      <div style="flex:1">${esc(c.text)}${c.source==="manual"?'<span style="color:#5F6368;font-size:10px"> · logged</span>':'<span style="color:#5F6368;font-size:10px"> · detected</span>'}</div>
    </div>`).join("")).join("");
  return `
  <div class="tbl" style="padding-bottom:8px">
    <div class="hd"><span class="eyebrow">Changelog &mdash; what shipped, newest first</span>
      <span style="font-size:11px;color:#5F6368">auto-detected from the daily crawl + logged entries</span></div>
    <div style="padding:4px 16px">${items}</div>
  </div>`;
}

// tile toggles + marker tooltips, rebound after every render
function wirePerf(snaps){
  document.querySelectorAll(".tile").forEach(t=>{
    t.onclick=()=>{
      const k=t.dataset.k;
      if(ACTIVE.has(k)){if(ACTIVE.size>1)ACTIVE.delete(k);}else ACTIVE.add(k);
      render(snaps);
    };
  });
  const tip=document.getElementById("mkTip"), wrap=document.getElementById("chartwrap");
  if(!tip||!wrap)return;
  const byDate={}; CHANGES.forEach(e=>{byDate[e.date]=e;});
  document.querySelectorAll(".mk-g").forEach(g=>{
    g.onmouseenter=ev=>{
      const e=byDate[g.dataset.date]; if(!e)return;
      tip.innerHTML=`<b>${esc(e.date)}</b><br>`+e.changes.map(c=>"• "+esc(c.text)).join("<br>");
      tip.style.opacity="1";
      const wr=wrap.getBoundingClientRect();
      tip.style.left=Math.min(Math.max(8,ev.clientX-wr.left-140),wr.width-300)+"px";
      tip.style.top="8px";
    };
    g.onmouseleave=()=>{tip.style.opacity="0";};
  });
}

function render(snaps){

  const cur=snaps[snaps.length-1],prev=snaps[snaps.length-2]||null;

    target?"TARGET ACHIEVED -- top 3 secured. Hold through MHRA decision."

  const techSection=(techFlags||prospectRows||psiCard)?`

    if(cur.flags?.wrong)L.push(`\n[!] Wrong-page routing live -- day ${streak(snaps,"wrong")}`);
    if(cur.flags?.legacy)L.push(`[!] Legacy URL still ranking -- day ${streak(snaps,"legacy")}`);

<script>

const cEsc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stateChip=st=>{const m={pass:["#1E8E3E","PASS"],warn:["#E8710A","IMPROVE"],fail:["#D93025","FIX"]};const[c,t]=m[st]||m.fail;return `<span class="tag" style="background:${c}">${t}</span>`;};

  const blocked=(a.blocked&&a.blocked.length)?`<div style="font-size:11px;color:var(--slate);margin-top:8px">Not fetched (bot-blocked/unreachable): ${a.blocked.map(cEsc).join(", ")}</div>`:"";

  el.innerHTML=`
  <div class="section-hd">
    <h2>Daily content review</h2>
    <span class="eyebrow">on-page gap analysis &middot; "${cEsc(a.phrase)}" SERP &middot; optimise for ${(a.primary||[]).map(cEsc).join(", ")}${a.mode&&a.mode!=='live'?' &middot; '+cEsc(a.mode)+' mode':''}</span>
  </div>
  <div class="grid">
    <div class="card alt-wrap" style="flex:0 0 220px">
      <div class="eyebrow">Pill-page alignment</div>
      <div class="gauge" style="color:${scoreColor(al.score)};margin-top:10px">${al.score}<span style="font-size:16px;color:var(--slate)">/100</span></div>
      <div class="mono" style="font-size:11px;color:var(--slate);margin-top:4px">${dScore!=null?('vs prev '+(dScore>0?'+':'')+dScore):'first review'}</div>
      <div style="font-size:11px;color:var(--slate);margin-top:12px;line-height:1.7">
        Body terms <strong style="color:var(--cream)">${al.body_cov}%</strong><br>
        FAQ topics <strong style="color:var(--cream)">${al.faq_cov}%</strong><br>
        Pages analysed <strong style="color:var(--cream)">${a.fetched}/${(a.pages||[]).length}</strong>
      </div>${blocked}
    </div>
    <div class="flags" style="flex:1 1 420px"><div class="eyebrow">Optimisation checks &mdash; title, meta, H1, opening copy, depth, FAQs, semantics</div>${checks}</div>
  </div>
  <div class="tbl">
    <div class="hd"><span class="eyebrow">Top results analysed vs our pill page</span><button id="copyContent">COPY REVIEW</button></div>
    <table><thead><tr><th>RANK</th><th>PAGE</th><th>TITLE TAG</th><th>WORDS</th><th>H2</th><th>FAQ</th><th>TARGET KW IN TITLE</th></tr></thead><tbody>${rows}</tbody></table>
  </div>
  <div class="grid">
    <div class="card" style="flex:1 1 320px">
      <div class="eyebrow" style="color:#D93025">Missing entities &mdash; brands &middot; trials &middot; compounds</div>
      <div style="margin-top:8px">${chips(al.entity_gaps)}</div>
      <div class="eyebrow" style="color:#D93025;margin-top:16px">Missing terms / topics &mdash; used by &ge;2 competitors</div>
      <div style="margin-top:8px">${chips(al.term_gaps)}</div>
    </div>
    <div class="card" style="flex:1 1 320px">
      <div class="eyebrow">FAQ gaps &mdash; questions competitors answer, we don't</div>
      <div style="margin-top:8px">${faqGaps}</div>
    </div>
  </div>
  <div class="tbl" style="padding-bottom:8px">
    <div class="hd"><span class="eyebrow">Prioritised opportunities</span></div>
    <div style="padding:6px 16px">${opps||'<div style="color:var(--slate);font-size:12px">No actions &mdash; page is well aligned.</div>'}</div>
  </div>`;

  const btn=document.getElementById("copyContent");
  if(btn)btn.onclick=async()=>{
    const L=[`WEGOVY SENTINEL -- CONTENT REVIEW ${a.date}`,`"${a.phrase}" -- alignment ${al.score}/100 (body ${al.body_cov}%, FAQ ${al.faq_cov}%)`,""];
    (al.checks||[]).forEach(c=>L.push(`[${c.state.toUpperCase()}] ${c.name}: ${c.evidence}`));
    if((al.entity_gaps||[]).length)L.push("\nMissing entities: "+al.entity_gaps.map(g=>g.term).join(", "));
    if((al.term_gaps||[]).length)L.push("Missing terms: "+al.term_gaps.map(g=>g.term).join(", "));
    if((al.faq_gaps||[]).length){L.push("\nFAQ gaps:");al.faq_gaps.forEach(q=>L.push(" - "+q));}
    if((a.opps||[]).length){L.push("\nOpportunities:");a.opps.forEach((o,i)=>L.push(` ${i+1}. ${o}`));}
    try{await navigator.clipboard.writeText(L.join("\n"));btn.textContent="COPIED";setTimeout(()=>btn.textContent="COPY REVIEW",1500);}catch(e){}
  };
}

fetch("./content.json",{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(renderContent)
  .catch(()=>{/* content review not seeded yet -- leave the panel empty */});
</script>
</body>
</html>
