<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wegovy Sentinel — search performance</title>
<link rel="stylesheet" href="assets/ui.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="brand">SENTINEL</span>
    <span class="brand-sub">Wegovy · simpleonlinepharmacy.co.uk</span>
    <span class="mode-badge" id="mode-badge" hidden></span>
  </div>
  <div class="topbar-right">
    <div class="pills" data-pill-group="daterange" id="daterange-pills">
      <button type="button" class="pill" data-value="28D">28D</button>
      <button type="button" class="pill active" data-value="90D">90D</button>
      <button type="button" class="pill" data-value="6M">6M</button>
      <button type="button" class="pill" data-value="All">All</button>
      <button type="button" class="pill" data-value="Custom">Custom</button>
    </div>
    <div class="custom-dates" id="custom-dates" hidden>
      <input type="date" id="date-from" aria-label="From date">
      <span class="patrol-note">→</span>
      <input type="date" id="date-to" aria-label="To date">
    </div>
    <span class="patrol-note" id="patrol-note"></span>
  </div>
</header>

<div class="page">
  <div class="page-header">
    <h1>Wegovy pill — search performance</h1>
    <div class="sub">Daily rank patrol, Search Console trends and on-page change tracking for the Wegovy pill cluster.</div>
  </div>
  <main id="sections"></main>
</div>

<footer class="footer">Collected daily by GitHub Actions · history in <code>data/</code></footer>

<script>
(function () {
  'use strict';

  var sections = [];

  window.Sentinel = {
    data: { snaps: [], changelog: [], content: [] },
    state: { from: '', to: '', preset: '90D' },
    pillHandlers: {},
    register: function (sec) {
      // {id, title, sub, order, render}
      sections.push(sec);
    },
    rerender: function () {
      var main = document.getElementById('sections');
      sections.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      sections.forEach(function (sec) {
        var card = document.getElementById('sec-' + sec.id);
        if (!card) {
          card = document.createElement('section');
          card.className = 'card';
          card.id = 'sec-' + sec.id;
          card.innerHTML =
            '<div class="card-head">' +
              '<h2 class="card-title"></h2>' +
              '<div class="card-sub"></div>' +
            '</div>' +
            '<div class="card-body"></div>';
          main.appendChild(card);
        }
        card.querySelector('.card-title').textContent = sec.title || '';
        var subEl = card.querySelector('.card-sub');
        subEl.textContent = sec.sub || '';
        subEl.hidden = !sec.sub;
        try {
          sec.render(card.querySelector('.card-body'), window.Sentinel);
        } catch (e) {
          card.querySelector('.card-body').innerHTML =
            '<div class="panel"><div class="empty">Section failed to render.</div></div>';
          if (window.console) console.error('Section "' + sec.id + '" render error:', e);
        }
      });
    }
  };

  /* ---------- helpers ---------- */

  function iso(dt) { return dt.toISOString().slice(0, 10); }
  function shiftDays(isoStr, n) {
    var dt = new Date(isoStr + 'T00:00:00Z');
    dt.setUTCDate(dt.getUTCDate() + n);
    return iso(dt);
  }

  function fetchJson(url) {
    return fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; });
  }

  function maxDataDate(snaps) {
    var max = '';
    (snaps || []).forEach(function (s) {
      if (s && s.date && s.date > max) max = s.date;
      var g = s && s.gscts;
      if (g) {
        ['site', 'page'].forEach(function (k) {
          (g[k] || []).forEach(function (p) {
            if (p && p.d && p.d > max) max = p.d;
          });
        });
      }
    });
    return max || iso(new Date());
  }

  function minDataDate(snaps) {
    var min = '';
    (snaps || []).forEach(function (s) {
      if (s && s.date && (!min || s.date < min)) min = s.date;
      var g = s && s.gscts;
      if (g) {
        ['site', 'page'].forEach(function (k) {
          (g[k] || []).forEach(function (p) {
            if (p && p.d && (!min || p.d < min)) min = p.d;
          });
        });
      }
    });
    return min;
  }

  function applyPreset(preset) {
    var S = window.Sentinel;
    var maxD = maxDataDate(S.data.snaps);
    S.state.preset = preset;
    if (preset === '28D') {
      S.state.to = maxD; S.state.from = shiftDays(maxD, -27);
    } else if (preset === '90D') {
      S.state.to = maxD; S.state.from = shiftDays(maxD, -89);
    } else if (preset === '6M') {
      S.state.to = maxD; S.state.from = shiftDays(maxD, -182);
    } else if (preset === 'All') {
      S.state.to = maxD; S.state.from = minDataDate(S.data.snaps) || shiftDays(maxD, -365);
    }
    // Custom keeps current from/to; the date inputs drive it.
    syncDateUI();
  }

  function syncDateUI() {
    var S = window.Sentinel;
    var group = document.getElementById('daterange-pills');
    Array.prototype.forEach.call(group.querySelectorAll('.pill'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-value') === S.state.preset);
    });
    document.getElementById('custom-dates').hidden = S.state.preset !== 'Custom';
    document.getElementById('date-from').value = S.state.from;
    document.getElementById('date-to').value = S.state.to;
  }

  /* ---------- global pill delegation ---------- */

  document.addEventListener('click', function (ev) {
    var pill = ev.target.closest ? ev.target.closest('[data-value]') : null;
    if (!pill) return;
    var group = pill.closest('[data-pill-group]');
    if (!group) return;
    var gid = group.getAttribute('data-pill-group');
    var value = pill.getAttribute('data-value');

    if (gid === 'daterange') {
      applyPreset(value);
      window.Sentinel.rerender();
      return;
    }
    var fn = window.Sentinel.pillHandlers[gid];
    if (typeof fn === 'function') fn(value);
    window.Sentinel.rerender();
  });

  document.getElementById('date-from').addEventListener('change', function () {
    if (this.value) { window.Sentinel.state.from = this.value; window.Sentinel.rerender(); }
  });
  document.getElementById('date-to').addEventListener('change', function () {
    if (this.value) { window.Sentinel.state.to = this.value; window.Sentinel.rerender(); }
  });

  /* ---------- boot ---------- */

  var dataReady = Promise.all([
    fetchJson('./snapshots.json'),
    fetchJson('./changelog.json'),
    fetchJson('./content.json')
  ]).then(function (res) {
    var S = window.Sentinel;
    S.data.snaps = Array.isArray(res[0]) ? res[0] : [];
    S.data.changelog = Array.isArray(res[1]) ? res[1] : [];
    S.data.content = Array.isArray(res[2]) ? res[2] : [];

    applyPreset('90D');

    var last = S.data.snaps.length ? S.data.snaps[S.data.snaps.length - 1] : null;
    if (last) {
      document.getElementById('patrol-note').textContent =
        'Last patrol: ' + last.date + ' · day ' + S.data.snaps.length;
      if (last.mode) {
        var badge = document.getElementById('mode-badge');
        badge.textContent = last.mode;
        badge.hidden = false;
      }
    } else {
      document.getElementById('patrol-note').textContent = 'No patrol data yet';
    }
  });

  var domReady = new Promise(function (resolve) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', resolve);
    } else { resolve(); }
  });

  Promise.all([dataReady, domReady]).then(function () {
    window.Sentinel.rerender();
  });
})();
</script>

<script src="assets/charts.js"></script>
<script defer src="assets/sections/perf.js" onerror="this.remove()"></script>
<script defer src="assets/sections/rankings.js" onerror="this.remove()"></script>
<script defer src="assets/sections/content.js" onerror="this.remove()"></script>

</body>
</html>
