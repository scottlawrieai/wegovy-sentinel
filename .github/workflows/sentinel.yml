name: Daily patrol

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - ".github/trigger-patrol"   # touch this file to run a patrol on demand

permissions:
  contents: write
  issues: write

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Wegovy Sentinel
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
          # Google Search Console (optional -- OAuth refresh-token auth)
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          # PageSpeed Insights (optional key -- keyless works but is rate-limited)
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          # Advanced Web Ranking (optional -- AWR Cloud v2 get API)
          AWR_API_TOKEN: ${{ secrets.AWR_API_TOKEN }}
          AWR_PROJECT: ${{ vars.AWR_PROJECT }}
          AWR_GEO: ${{ vars.AWR_GEO }}
          AWR_DEVICE: ${{ vars.AWR_DEVICE }}
          # Google Analytics 4 (optional -- sessions/key events for the pill page)
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
        run: python sentinel.py

      - name: Raise alerts (GitHub issue on drops / overtakes)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerts.py

      - name: Update changelog (structural diff crawl)
        if: always()
        run: python changelog.py

      - name: Run Mounjaro Sentinel
        if: always()
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
          # Google Search Console (optional -- OAuth refresh-token auth)
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          # PageSpeed Insights (optional key -- keyless works but is rate-limited)
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          # Advanced Web Ranking (optional -- AWR Cloud v2 get API)
          AWR_API_TOKEN: ${{ secrets.AWR_API_TOKEN }}
          AWR_PROJECT: ${{ vars.AWR_PROJECT }}
          AWR_GEO: ${{ vars.AWR_GEO }}
          AWR_DEVICE: ${{ vars.AWR_DEVICE }}
          # Google Analytics 4 (optional -- sessions/key events for the pill page)
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
        run: python mounjaro_sentinel.py

      - name: Mounjaro changelog
        if: always()
        run: python changelog.py --product mounjaro

      - name: Mounjaro alerts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerts.py --product mounjaro

      - name: Run Wegovy Injection Sentinel
        if: always()
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
          # Google Search Console (optional -- OAuth refresh-token auth)
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          # PageSpeed Insights (optional key -- keyless works but is rate-limited)
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          # Advanced Web Ranking (optional -- AWR Cloud v2 get API)
          AWR_API_TOKEN: ${{ secrets.AWR_API_TOKEN }}
          AWR_PROJECT: ${{ vars.AWR_PROJECT }}
          AWR_GEO: ${{ vars.AWR_GEO }}
          AWR_DEVICE: ${{ vars.AWR_DEVICE }}
          # Google Analytics 4 (optional -- sessions/key events for the pill page)
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
        run: python wegovy_injection_sentinel.py

      - name: Wegovy injection changelog
        if: always()
        run: python changelog.py --product wegovy-injection

      - name: Wegovy injection alerts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerts.py --product wegovy-injection

      - name: Run Foundayo Sentinel
        if: always()
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
        run: python foundayo_sentinel.py

      - name: Commit snapshot history
        if: always()
        run: |
          git config user.name "wegovy-sentinel"
          git config user.email "actions@users.noreply.github.com"
          # One add per file: a single multi-path git add is all-or-nothing,
          # so one missing file (e.g. an alerts state that has never been
          # written) would silently unstage the entire patrol.
          for f in data/snapshots.json docs/snapshots.json \
                   data/content.json docs/content.json \
                   data/changelog.json docs/changelog.json \
                   data/alerts_state.json \
                   data/mounjaro_snapshots.json docs/mounjaro_snapshots.json \
                   data/mounjaro_content.json docs/mounjaro_content.json \
                   data/mounjaro_changelog.json docs/mounjaro_changelog.json \
                   data/mounjaro_alerts_state.json \
                   data/wegovy_injection_snapshots.json docs/wegovy_injection_snapshots.json \
                   data/wegovy_injection_content.json docs/wegovy_injection_content.json \
                   data/wegovy_injection_changelog.json docs/wegovy_injection_changelog.json \
                   data/wegovy_injection_alerts_state.json \
                   data/foundayo_snapshots.json docs/foundayo_snapshots.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "patrol: $(date -u +%F)"
          git push
