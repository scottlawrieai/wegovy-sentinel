name: Sentinel Patrol

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wegovy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Wegovy sentinel
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
        run: python sentinel.py
      - name: Commit Wegovy snapshot
        run: |
          git config user.name  "sentinel-bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          git add docs/snapshots.json docs/index.html
          git diff --cached --quiet || git commit -m "wegovy patrol $(date -u +%F)"
          git push

  foundayo:
    needs: wegovy                 # sequential to avoid push conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest (after Wegovy push)
        run: git pull origin main
      - name: Run Foundayo sentinel
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
        run: python foundayo_sentinel.py
      - name: Commit Foundayo snapshot
        run: |
          git config user.name  "sentinel-bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          git add docs/foundayo_snapshots.json docs/foundayo.html
          git diff --cached --quiet || git commit -m "foundayo patrol $(date -u +%F)"
          git push
